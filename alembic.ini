
# Configuration Alembic du schéma PostgreSQL CMU.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Aucune sqlalchemy.url ici : alembic/env.py lit DATABASE_URL depuis le .env.
# La ligne qui s'y trouvait pointait vers une base au mot de passe factice, et
# ne servait que de repli silencieux quand la variable manquait — un repli qui
# transformait une configuration absente en erreur de connexion incompréhensible.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
