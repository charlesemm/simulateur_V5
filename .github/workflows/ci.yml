# .github/workflows/ci.yml
#
# Le pipeline complet du projet, en deux temps :
#
#   1. VÉRIFIER (CI)  — le code compile, les migrations passent sur une base
#      vierge, les tests sont verts, l'API démarre, le dashboard se construit.
#      Ce temps-là tourne pour toute branche et toute pull request.
#
#   2. LIVRER (CD)    — l'image du Containerfile est construite et publiée sur
#      GHCR, l'entrepôt d'images de GitHub. Ce temps-là ne tourne que pour
#      « main » et les tags de version, et seulement si le temps 1 est vert.
#
# Le pipeline s'arrête à l'image : il ne se connecte à aucun serveur. La mise
# en production consiste à tirer cette image depuis la machine cible, et reste
# lancée à la main — voir GUIDE_DEPLOIEMENT.md et le dossier « deploiement/ ».
# L'automatiser depuis ici est le point ouvert du chantier X2.
#
# Documentation : GUIDE_CICD.md

name: CI/CD — Tests, Build & Image

on:
  push:
    # « develop » a été retirée : cette branche n'existe pas dans le dépôt et
    # laissait croire à un flux de travail qui n'est pas le nôtre.
    branches: [main, "feature/**"]
    # Un tag « v1.0.0 » déclenche aussi le pipeline : c'est ainsi qu'on fige
    # une version, avec une image étiquetée à son numéro.
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci_test_password
  POSTGRES_DB: cmu_simulator
  JWT_SECRET_KEY: ci-jwt-secret-not-for-production
  # Base de travail. La suite de tests en dérive « cmu_simulator_test » et
  # refuse de démarrer si les deux coïncident : elle tronque les tables.
  DATABASE_URL: postgresql+asyncpg://postgres:ci_test_password@localhost:5432/cmu_simulator
  CORS_ORIGINS: http://localhost:5173

jobs:

  backend:
    name: Backend — compile, migrations, tests, smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: cmu_simulator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall app api auth events kpi metrics realtime reports seed simulation

      - name: Appliquer les migrations Alembic
        run: python -m alembic upgrade head

      - name: Créer la base de test
        # La suite applique elle-même les migrations dessus, mais PostgreSQL
        # n'expose pas de « CREATE DATABASE IF NOT EXISTS ».
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE cmu_simulator_test"

      - name: Tests — pytest
        run: python -m pytest

      - name: Smoke test — l'API démarre et répond /health
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8765 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health; then
              echo "✅ API OK"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "❌ L'API n'a pas répondu à temps"
          kill $SERVER_PID || true
          exit 1

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Installer les dépendances npm
        working-directory: dashboard
        # `--legacy-peer-deps` pour la même raison que dans le Containerfile :
        # recharts 2.13 se déclare incompatible avec React 19 alors qu'il
        # fonctionne. Sans cette tolérance, les deux installations divergeraient
        # et la CI passerait au vert sur un projet dont l'image ne se construit
        # pas — le pire des cas.
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build production
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run build

  # ════════════════════════════════════════════════════════════════════════
  # TEMPS 2 — LIVRER
  #
  # Construit l'image du Containerfile et la publie sur GHCR.
  # ════════════════════════════════════════════════════════════════════════

  image:
    name: Image — construction et publication sur GHCR
    runs-on: ubuntu-latest

    # La barrière du pipeline. Sans ce `needs`, les trois jobs partiraient en
    # même temps et une image pourrait être publiée pendant que les tests
    # échouent — c'est-à-dire du code cassé mis à disposition.
    needs: [backend, frontend]

    # Une pull request propose du code, elle ne le livre pas : elle ne publie
    # donc aucune image. Seules deux situations en produisent une — l'arrivée
    # sur « main » (la version courante) et un tag « v… » (une version figée).
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      # Indispensable : le jeton que GitHub prête au job ne sait que lire par
      # défaut, et l'envoi vers ghcr.io serait refusé en 403.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Aligner l'exclusion de contexte sur celle de Podman
        # Podman lit « .containerignore » ; le moteur de construction de
        # GitHub, lui, ne connaît que « .dockerignore ». Sans cette copie,
        # .git/, .venv/ et node_modules/ partiraient dans le contexte de
        # construction : envoi bien plus lourd, et le « COPY . . » de l'étage
        # final embarquerait tout cela dans l'image publiée.
        # On copie plutôt que de tenir deux listes, qui finiraient par diverger.
        run: cp .containerignore .dockerignore

      - name: Calculer le nom de l'image en minuscules
        id: nom
        # GHCR n'accepte que des minuscules, or le dépôt s'appelle
        # « simulateur_V5 » : repris tel quel, l'envoi échouerait sur un nom
        # invalide. « ${VAR,,} » est la mise en minuscules de bash.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Ouvrir la session sur GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton fabriqué par GitHub pour cette exécution et périmé à la fin
          # du job. Rien à créer, rien à renouveler, rien à mettre en secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Décider des étiquettes de l'image
        id: etiquettes
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nom.outputs.image }}
          # « latest » suit main et bouge donc en permanence : pratique, mais
          # il ne désigne aucune version en particulier. « sha-… » nomme le
          # commit exact — c'est le seul repère fiable pour dire « la machine
          # tourne sur celle-ci ». Un tag « v1.2.3 » ajoute « 1.2.3 » et
          # « 1.2 », pour suivre une version mineure sans la figer.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Préparer le constructeur
        # Buildx sait réutiliser les étages déjà construits d'une exécution à
        # l'autre ; la construction classique en est incapable.
        uses: docker/setup-buildx-action@v3

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          labels: ${{ steps.etiquettes.outputs.labels }}
          # Le cache conserve les étages intermédiaires entre deux exécutions.
          # Sans lui, « npm ci » et « pip install » seraient refaits en entier
          # à chaque poussée, pour un résultat identique.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapituler l'adresse de l'image
        # S'affiche en clair sur la page de l'exécution : on y lit la commande
        # à lancer sans avoir à fouiller les journaux de construction.
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.etiquettes.outputs.tags }}"
            echo '```'
            echo
            echo "Pour la récupérer :"
            echo
            echo '```'
            echo "podman pull ${{ steps.nom.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
