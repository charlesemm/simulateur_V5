# .github/workflows/ci.yml
# Vérifie que le code compile, que le frontend build, et que l'API démarre.

name: CI — Tests & Build

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci_test_password
  POSTGRES_DB: cmu_simulator
  JWT_SECRET_KEY: ci-jwt-secret-not-for-production
  # Base de travail. La suite de tests en dérive « cmu_simulator_test » et
  # refuse de démarrer si les deux coïncident : elle tronque les tables.
  DATABASE_URL: postgresql+asyncpg://postgres:ci_test_password@localhost:5432/cmu_simulator
  CORS_ORIGINS: http://localhost:5173

jobs:

  backend:
    name: Backend — compile, migrations, tests, smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: cmu_simulator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall app api auth events kpi metrics realtime reports seed simulation

      - name: Appliquer les migrations Alembic
        run: python -m alembic upgrade head

      - name: Créer la base de test
        # La suite applique elle-même les migrations dessus, mais PostgreSQL
        # n'expose pas de « CREATE DATABASE IF NOT EXISTS ».
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE cmu_simulator_test"

      - name: Tests — pytest
        run: python -m pytest

      - name: Smoke test — l'API démarre et répond /health
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8765 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health; then
              echo "✅ API OK"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "❌ L'API n'a pas répondu à temps"
          kill $SERVER_PID || true
          exit 1

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Installer les dépendances npm
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build production
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run build
