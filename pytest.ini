[pytest]
testpaths = tests
# Le mode automatique évite d'annoter chaque test asynchrone : la suite en
# compte une large majorité.
asyncio_mode = auto
# Une seule boucle d'événements pour toute la suite : le moteur SQLAlchemy
# est construit à l'import et son pool de connexions s'attache à la première
# boucle qui l'utilise. Une boucle par test rendrait ces connexions inutilisables.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
markers =
    base: test qui a besoin d'une base PostgreSQL de test
