# ═══════════════════════════════════════════════════════════════
# ÉCHO — Podman Compose (compatible docker compose)
#
# Démarre PostgreSQL et l'API en un seul geste.
# Le dashboard compilé est servi par uvicorn via les fichiers
# statiques — pas de conteneur Nginx séparé en dev.
# ═══════════════════════════════════════════════════════════════

services:
  # ── Base de données ──────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: echo_db
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echo_dev_2026}
    # Publié temporairement sur 5433 (5432 est déjà pris par le PostgreSQL
    # natif du poste) pour une inspection DBeaver -- à retirer une fois fini.
    # Alternative sans rien publier :
    #   podman compose exec postgres psql -U echo -d echo_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    # wal_level=logical : requis par Debezium (CDC) pour lire le flux de
    # réplication logique de PostgreSQL. Pas actif par défaut sur l'image
    # postgres:16-alpine standard — changement pris en compte seulement au
    # redémarrage du conteneur (podman compose down && up -d).
    command: ["postgres", "-c", "wal_level=logical"]

  # ── API + dashboard ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://echo:${POSTGRES_PASSWORD:-echo_dev_2026}@postgres:5432/echo_db
      CORS_ORIGIN_REGEX: "http://(localhost|127\\.0\\.0\\.1)(:\\d+)?"
      # Clé de signature des jetons. Sans elle l'API refuse de démarrer, et
      # le `.env` du dépôt n'entre pas dans l'image : elle doit venir d'ici.
      # La forme `:?` fait échouer le lancement avec ce message plutôt que
      # de laisser un conteneur redémarrer en boucle sans qu'on sache pourquoi.
      # La valeur est entre guillemets : le message contient un « : », que YAML
      # lirait autrement comme une structure et rejetterait tout le fichier.
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?obligatoire - generez-la avec la commande donnee dans GUIDE_PODMAN.md}"
      # Lu par « python -m auth.bootstrap --creer » pour poser le premier
      # administrateur. Le mot de passe passe par l'environnement et non par
      # la ligne de commande : il ne se retrouve ainsi ni dans l'historique
      # du terminal, ni dans la liste des processus.
      ECHO_ADMIN_PASSWORD: ${ECHO_ADMIN_PASSWORD:-MotDePasseAdmin1}
    volumes:
      - rapports:/app/reports/output
    # Un processus peut tourner sans plus repondre : sans cette sonde, Podman
    # le croirait en bonne sante indefiniment. /health ne touche pas la base,
    # il atteste seulement que l'ASGI repond.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      # L'API lit le catalogue d'anomalies dès son démarrage : sans les
      # tables, elle s'effondre. Attendre la base ne suffisait pas — elle
      # partait en même temps que les migrations et arrivait la première.
      migrations:
        condition: service_completed_successfully

  # ── Migrations (exécuté une fois puis s'arrête) ─────────────
  migrations:
    build:
      context: .
      dockerfile: Containerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://echo:${POSTGRES_PASSWORD:-echo_dev_2026}@postgres:5432/echo_db
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: simulateur_v5_net
    external: true

volumes:
  pgdata:
  rapports:
