# ═══════════════════════════════════════════════════════════════
# ÉCHO — Ce que SonarQube doit lire, et ce qu'il doit ignorer
#
# Ce fichier est lu par le scanner (sonar-scanner) depuis la racine
# du dépôt. Il ne contient aucun secret : le jeton d'analyse se
# passe en ligne de commande ou par la variable SONAR_TOKEN.
#
# Documentation et scénario de recette : docs/guides/sonarqube.md
# ═══════════════════════════════════════════════════════════════

sonar.projectKey=ECHO---simulateur-CMU
sonar.projectName=ÉCHO — Simulateur CMU
sonar.projectVersion=1.0

# Les fichiers du dépôt sont en UTF-8, accents compris. Sans cette
# ligne le scanner suit l'encodage du système : sous Windows il
# lirait « N'Guessan » de travers et signalerait de faux défauts.
sonar.sourceEncoding=UTF-8

# ── Ce qui est analysé ───────────────────────────────────────────
# On énumère les dossiers plutôt que d'écrire « . » : la racine
# embarquerait alembic/, seed/, les .md et les captures, qui ne
# sont pas du code applicatif et fausseraient tous les compteurs.
sonar.sources=\
  anomalies,\
  api,\
  app,\
  auth,\
  campagnes,\
  entrepot,\
  events,\
  gouvernance,\
  kpi,\
  mdm,\
  metrics,\
  qualite,\
  realtime,\
  reports,\
  simulation,\
  dashboard/src

# Les tests sont déclarés à part. Ainsi SonarQube ne leur reproche
# pas leur duplication (normale dans des tests) et ne les compte
# pas dans la dette technique de l'application.
sonar.tests=tests

# ── Ce qui est écarté ────────────────────────────────────────────
sonar.exclusions=\
  **/__pycache__/**,\
  **/node_modules/**,\
  dashboard/dist/**,\
  alembic/versions/**,\
  **/*.min.js

# Les migrations Alembic sont exclues volontairement : ce sont des
# fichiers figés, jamais retouchés une fois appliqués. Les signaler
# produirait une dette qu'on ne corrigera jamais, ce qui apprend à
# ignorer le tableau de bord — le pire qui puisse lui arriver.

# ── Couverture des tests ─────────────────────────────────────────
# Ces deux rapports sont produits AVANT l'analyse (voir le guide).
# Si les fichiers sont absents, l'analyse réussit quand même :
# SonarQube affiche simplement « 0 % » de couverture.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=dashboard/coverage/lcov.info

sonar.python.version=3.12
