# docker-compose.yml — Environnement de DÉVELOPPEMENT
# Usage : docker compose up -d --build

services:

  db:
    image: postgres:16-alpine
    container_name: cmu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azerty2001}
      POSTGRES_DB: ${POSTGRES_DB:-cmu_simulator}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      cmu_net:
        aliases:
          - db
          - cmu_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cmu_simulator}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmu_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cmu_net
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-azerty2001}@db:5432/${POSTGRES_DB:-cmu_simulator}}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me-en-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ANOMALIES_ENABLED: ${ANOMALIES_ENABLED:-false}
      ANOMALIES_RATE: ${ANOMALIES_RATE:-0.0}
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload : ton code local → conteneur
      - ./api:/app/api
      - ./app:/app/app
      - ./auth:/app/auth
      - ./events:/app/events
      - ./kpi:/app/kpi
      - ./metrics:/app/metrics
      - ./realtime:/app/realtime
      - ./reports:/app/reports
      - ./seed:/app/seed
      - ./simulation:/app/simulation
      - ./simulation_config.py:/app/simulation_config.py
      - ./alembic:/app/alembic
      - reports_output:/app/reports/output
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  dashboard:
    image: node:22-alpine
    container_name: cmu_dashboard
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - cmu_net
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"

networks:
  cmu_net:
    driver: bridge

volumes:
  postgres_data:
  reports_output:
  dashboard_node_modules:
