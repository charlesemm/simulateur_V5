# Vhost nginx pour ÉCHO — à déposer dans /etc/nginx/conf.d/ sur srv-gouv.
#
# Pourquoi nginx et non Caddy, contrairement à ce que décrivait le
# Caddyfile : srv-gouv est une machine PARTAGÉE, et nginx y occupe déjà les
# ports 80 et 443 pour socle.ipscnam.ci. Deux programmes ne peuvent pas
# écouter le même port — Caddy refuserait de démarrer. ÉCHO se range donc
# derrière le portier existant, comme Socle avant lui.
#
# Ce fichier reprend les conventions de socle.ipscnam.ci.conf (même TLS,
# mêmes en-têtes de relais, journaux séparés, pas de default_server) et y
# ajoute CE QUE LE CADDYFILE FAISAIT ET QUE SOCLE N'A PAS BESOIN DE FAIRE :
# le blocage du témoin, les en-têtes de sécurité, et la montée en WebSocket.
#
# ── Installation ──────────────────────────────────────────────────────────
#   sudo cp deploiement/nginx/echo.ipscnam.ci.conf /etc/nginx/conf.d/
#   sudo nginx -t                    # valide la syntaxe AVANT de recharger
#   sudo systemctl reload nginx      # reload, pas restart : ne coupe pas Socle
#
# Le certificat est le wildcard *.ipscnam.ci déjà en place pour Socle et
# AnyFiX : il couvre echo.ipscnam.ci sans nouvelle demande.
# ⚠️ Il expire le 20/11/2026 — le renouvellement devra désormais couvrir
# TROIS serveurs, ÉCHO compris.

# La montée en WebSocket, pour Socket.IO (/socket.io, namespace /kpi) : sans
# elle, les indicateurs temps réel du tableau de bord ne se connectent jamais.
# La valeur dépend de la requête — « upgrade » quand le client le demande,
# « close » sinon —, d'où cette table plutôt qu'un en-tête figé.
#
# ⚠️ Cette table est globale à nginx : si un autre vhost de conf.d venait à
# définir $connection_upgrade lui aussi, nginx refuserait de démarrer sur un
# « duplicate map ». Aucun ne le fait aujourd'hui.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name echo.ipscnam.ci;

    # Rien ne se sert en clair : tout remonte en HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # « listen … http2 » est la seule syntaxe valide en nginx 1.14 (Oracle
    # Linux 8). Voir la note détaillée dans socle.ipscnam.ci.conf : ne pas
    # « corriger » vers « http2 on; », qui ferait échouer le démarrage.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name echo.ipscnam.ci;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    ssl_certificate     /etc/ssl/certs/nginx.pem;
    ssl_certificate_key /etc/ssl/certs/nginx.key;

    # Pas de « default_server », pour la même raison que Socle : un seul vhost
    # peut l'être, et se l'attribuer ferait d'ÉCHO la destination de tout
    # trafic dont le nom ne correspond à personne.

    # 10 Mo, et non la limite applicative de 512 Mio : la SEULE route qui
    # reçoit un fichier est /temoin/*, bloquée juste en dessous. Aucune route
    # exposée ne reçoit de fichier — les corps sont du JSON de quelques
    # kilo-octets. Le plafond borne ce qu'un envoi peut coûter.
    client_max_body_size 10M;

    server_tokens off;

    access_log /var/log/nginx/echo.access.log;
    error_log  /var/log/nginx/echo.error.log;

    # ── Les en-têtes de sécurité ─────────────────────────────────────────
    # « always » est indispensable : sans lui, nginx ne les pose pas sur les
    # réponses d'erreur (4xx, 5xx), qui sont précisément celles qu'un
    # attaquant cherche à provoquer.
    #
    # Le navigateur n'essaiera plus jamais ce domaine en clair.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Pas d'interprétation d'un type MIME deviné : un export CSV reste un
    # fichier à télécharger, il ne peut pas être joué comme du HTML.
    add_header X-Content-Type-Options "nosniff" always;
    # ÉCHO ne s'affiche dans aucun cadre : bloquer le détournement de clic.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Le jeton de session vit dans le localStorage du navigateur, et la base
    # contient volontairement des charges XSS (anomalies TENTATIVE_INJECTION).
    # React les échappe ; cette politique reste entre la charge et le jeton si
    # une vue cessait un jour de le faire. Scripts : l'origine seule (Vite
    # compile tout en fichiers). Styles : 'unsafe-inline' pour les styles posés
    # par les bibliothèques, plus Google Fonts, que charge index.html.
    # wss:// pour Socket.IO.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://echo.ipscnam.ci; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript
               application/xml image/svg+xml;

    # ── Ce qui ne passe pas ──────────────────────────────────────────────
    # Les deux routes du témoin sont les seules de l'API sans jeton. Il n'est
    # appelé que par ÉCHO lui-même, depuis l'intérieur du conteneur
    # (campagnes/echange.py) : rien ne justifie de les offrir au réseau.
    #
    # « ^~ » plutôt qu'un simple préfixe : il coupe court à l'évaluation des
    # emplacements par expression régulière, et couvre « /temoin » comme
    # « /temoin/analyser ».
    location ^~ /temoin {
        return 404;
    }

    location / {
        # Le port 8000 n'est publié QUE sur la boucle locale par
        # compose.prod.yaml : rien sur le réseau ne joint l'API directement.
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # La montée en WebSocket de Socket.IO. Sans ces deux lignes, la
        # connexion reste en « polling » dégradé, puis échoue.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        # Le flux temps réel garde la connexion ouverte entre deux messages,
        # et la génération d'un jeu de campagne dépasse les 60 s par défaut.
        proxy_read_timeout    120s;

        # Le temps réel n'a aucun sens s'il est mis en mémoire tampon : sans
        # cela, nginx retiendrait les messages du flux jusqu'à remplir son
        # tampon avant de les transmettre au navigateur.
        proxy_buffering off;
    }
}
